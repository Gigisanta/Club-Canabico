services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bombo
      POSTGRES_DB: bombo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private database password}
    volumes:
      - operations-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bombo -d bombo"]
      interval: 5s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: ${OPERATIONS_ENV_FILE:?Provide a private environment file}
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
volumes:
  operations-data:
