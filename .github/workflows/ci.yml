name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raiz
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: raiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raiz -d raiz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://raiz@localhost:5432/raiz?schema=public
      TEST_DATABASE_URL: postgresql://raiz@localhost:5432/raiz?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
